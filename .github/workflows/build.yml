name: build

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Leakage check
        run: python3 tools/leakage_check.py

      - name: Configure sanitizer build
        run: |
          cmake -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g"

      - name: Build sanitizer target
        run: cmake --build build-sanitize

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest \
            --test-dir build-sanitize \
            --output-on-failure

      - name: Configure hardened Release
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -fstack-protector-strong -D_FORTIFY_SOURCE=2 -ffile-prefix-map=${GITHUB_WORKSPACE}=. -fdebug-prefix-map=${GITHUB_WORKSPACE}=." \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,defs,-z,relro,-z,now,-z,noexecstack"

      - name: Build
        run: cmake --build build

      - name: Check RELRO
        shell: bash
        run: |
          set -euo pipefail

          if ! readelf -W -l build/libmobius_bridge.so \
            | grep -q 'GNU_RELRO'; then
            echo "GNU_RELRO not found."
            exit 1
          fi

          echo "RELRO check: PASS"

      - name: Check immediate binding
        shell: bash
        run: |
          set -euo pipefail

          if ! readelf -W -d build/libmobius_bridge.so \
            | grep -Eq 'BIND_NOW|FLAGS.*NOW'; then
            echo "Immediate binding not enabled."
            exit 1
          fi

          echo "BIND_NOW check: PASS"

      - name: Check non-executable stack
        shell: bash
        run: |
          set -euo pipefail

          stack_line="$(
            readelf -W -l build/libmobius_bridge.so \
              | grep 'GNU_STACK' || true
          )"

          if [ -z "${stack_line}" ]; then
            echo "GNU_STACK header not found."
            exit 1
          fi

          if printf '%s\n' "${stack_line}" | grep -q 'RWE'; then
            echo "Executable stack detected."
            exit 1
          fi

          echo "Non-executable stack check: PASS"

      - name: Check dynamic dependency surface
        shell: bash
        run: |
          set -euo pipefail

          readelf -W -d build/libmobius_bridge.so \
            | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' \
            | sort -u > actual_needed.txt

          printf "%s\n" \
            libc.so.6 \
            | sort -u > expected_needed.txt

          diff -u expected_needed.txt actual_needed.txt

          echo "Dynamic dependency allowlist: PASS"

      - name: Check forbidden capability imports
        shell: bash
        run: |
          set -euo pipefail

          nm -D --undefined-only build/libmobius_bridge.so \
            | awk '{print $2}' \
            | sed 's/@.*//' \
            | sort -u > undefined_imports.txt

          forbidden_regex='^(dlopen|dlmopen|dlsym|socket|socketpair|connect|accept|accept4|bind|listen|send|sendto|sendmsg|recv|recvfrom|recvmsg|getaddrinfo|gethostbyname|system|popen|fork|vfork|execve|execv|execvp|execl|execlp|posix_spawn|ptrace)$'

          if grep -E "${forbidden_regex}" undefined_imports.txt; then
            echo "Forbidden runtime capability import detected."
            exit 1
          fi

          echo "Forbidden capability import check: PASS"

      - name: Check forbidden runtime paths
        shell: bash
        run: |
          set -euo pipefail

          if readelf -W -d build/libmobius_bridge.so \
            | grep -Eq '\(RPATH\)|\(RUNPATH\)'; then
            echo "RPATH/RUNPATH detected."
            exit 1
          fi

          echo "RPATH/RUNPATH check: PASS"

      - name: Check text relocations
        shell: bash
        run: |
          set -euo pipefail

          if readelf -W -d build/libmobius_bridge.so \
            | grep -q 'TEXTREL'; then
            echo "TEXTREL detected."
            exit 1
          fi

          echo "TEXTREL check: PASS"

      - name: Strip release binary
        run: |
          strip --strip-unneeded build/libmobius_bridge.so

      - name: Check debug sections
        shell: bash
        run: |
          set -euo pipefail

          if readelf -S build/libmobius_bridge.so \
            | grep -E '\.debug_|\.zdebug_'; then
            echo "Debug information detected."
            exit 1
          fi

          echo "Debug section check: PASS"

      - name: Check absolute path leakage
        shell: bash
        run: |
          set -euo pipefail

          if strings -a build/libmobius_bridge.so \
            | grep -F "${GITHUB_WORKSPACE}"; then
            echo "Absolute build path detected."
            exit 1
          fi

          echo "Absolute path check: PASS"

      - name: Verify ABI exports
        shell: bash
        run: |
          set -euo pipefail

          nm -D --defined-only build/libmobius_bridge.so \
            | awk '{print $3}' \
            | sort > actual_exports.txt

          printf "%s\n" \
            mb_create \
            mb_destroy \
            mb_run \
            | sort > expected_exports.txt

          diff -u expected_exports.txt actual_exports.txt

          echo "ABI export check: PASS"

      - name: Runtime test
        run: ctest --test-dir build --output-on-failure

      - name: Generate SHA256
        working-directory: build
        run: |
          sha256sum libmobius_bridge.so > libmobius_bridge.so.sha256
          cat libmobius_bridge.so.sha256

      - name: Verify SHA256
        working-directory: build
        run: |
          sha256sum -c libmobius_bridge.so.sha256

      - name: Write provenance
        run: |
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
          } > build/provenance.txt

      - name: Upload verified bridge artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobius-bridge-linux-${{ github.sha }}
          path: |
            build/libmobius_bridge.so
            build/libmobius_bridge.so.sha256
            build/provenance.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0